# Builds the winget manifests for a published release and tests them with the real winget on a clean
# Windows runner: validate, install, start the app from winget's folder, uninstall. The tested manifests
# are uploaded as an artifact; they are what gets submitted to github.com/microsoft/winget-pkgs.
name: winget manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version (e.g. 1.4.0)
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Validate, install and uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make manifests
        shell: bash
        run: ./winget/make-manifests.sh "${{ inputs.version }}" winget-out

      - name: Make sure winget is available
        shell: powershell
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version

      - name: Validate and install
        shell: powershell
        run: |
          $dir = "winget-out/manifests/b/b3hz4d/BSSIDLock/${{ inputs.version }}"
          Get-ChildItem $dir | ForEach-Object { "---- $($_.Name)"; Get-Content $_.FullName }
          winget settings --enable LocalManifestFiles
          winget validate --manifest $dir
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
          winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install failed ($LASTEXITCODE)" }
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Recurse -Filter BSSIDLock.exe | Select-Object -First 1
          if (-not $exe) { throw 'BSSIDLock.exe is not in the winget packages folder' }
          "Installed: $($exe.FullName)"
          $link = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\bssidlock.exe'
          if (-not (Test-Path $link)) { throw 'the bssidlock command alias is missing' }

      - name: Start from winget's folder (Settings should say updates go through winget)
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $settingsDir = Join-Path $env:APPDATA 'BSSIDLock'
          New-Item -ItemType Directory -Force $settingsDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $settingsDir 'settings.json'), '{"Networks":[{"Ssid":"Office","Favorites":[],"Target":null}],"Ssid":"Office","LockEnabled":true,"IntervalSeconds":10,"TrayHintShown":true,"Theme":"light","AutoUpdate":false,"NotifyChanges":false}')
          $link = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\bssidlock.exe'
          $p = Start-Process $link -ArgumentList @('--demo', '--open-settings') -PassThru
          Start-Sleep -Seconds 8
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path (Resolve-Path shots) 'winget-settings.png'))
          $g.Dispose(); $bmp.Dispose()
          if (-not (Get-Process BSSIDLock -ErrorAction SilentlyContinue)) { throw 'BSSIDLock is not running' }
          Get-Process BSSIDLock | Stop-Process -Force
          Start-Sleep -Seconds 2
          $log = Join-Path $settingsDir 'error.log'
          if (Test-Path $log) { Get-Content $log; throw 'BSSIDLock wrote an error log' }

      - name: Uninstall
        shell: powershell
        run: |
          winget uninstall --manifest "winget-out/manifests/b/b3hz4d/BSSIDLock/${{ inputs.version }}" --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget uninstall failed ($LASTEXITCODE)" }
          if (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Recurse -Filter BSSIDLock.exe -ErrorAction SilentlyContinue) { throw 'BSSIDLock.exe is still installed' }
          'OK: removed'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winget-manifests-${{ inputs.version }}
          path: |
            winget-out
            shots
