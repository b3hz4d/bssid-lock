name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal, ad-hoc signed)
        run: ./macos/build.sh

      - name: Zip
        run: cd macos/build && ditto -c -k --keepParent BSSIDLock.app BSSIDLock-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BSSIDLock-macOS
          path: macos/build/BSSIDLock-macOS.zip

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: ./windows/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: BSSIDLock-Windows
          path: windows/out/BSSIDLock.exe
